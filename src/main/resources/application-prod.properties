# ==================================================
# PERFIL DE PRODUCCIÓN - MYSQL (PARA VPS HOSTINGER)
# ==================================================
# Activa este perfil con: spring.profiles.active=prod
# Requiere MySQL instalado y configurado

spring.application.name=inventlook

# SERVIDOR
server.port=8080

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/inventlook?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=inventlook
spring.datasource.password=${DB_PASSWORD:inventlook2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# THYMELEAF
spring.thymeleaf.cache=true

# CONFIGURACIÓN DE CORREO (producción)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noireliteofficial@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
