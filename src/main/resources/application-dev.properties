# ==================================================
# PERFIL DE DESARROLLO - H2 DATABASE (EN MEMORIA)
# ==================================================
# Activa este perfil con: spring.profiles.active=dev
# Este perfil NO requiere MySQL instalado

spring.application.name=inventlook

# SERVIDOR
server.port=8080

# H2 DATABASE (EN MEMORIA)
spring.datasource.url=jdbc:h2:mem:inventlook
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 CONSOLE (Acceder en: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# THYMELEAF
spring.thymeleaf.cache=false

# CONFIGURACIÓN DE CORREO (para desarrollo local)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noireliteofficial@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
